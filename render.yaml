services:
  # ---------------------------------------------------------
  # Go Backend API (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: krishnova-api
    env: go
    plan: free
    # Render will automatically run `go build` but we can specify the exact directory
    buildCommand: cd "Learning System/backend" && go build -o main .
    startCommand: cd "Learning System/backend" && ./main
    envVars:
      - key: DATABASE_URL
        # This prevents the value from being committed, you will paste it in the Render dashboard
        sync: false
      - key: DATABASE_NAME
        value: learning_system
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ---------------------------------------------------------
  # React Frontend (Static Site)
  # ---------------------------------------------------------
  - type: web
    name: krishnova-web
    env: static
    # Build the Vite frontend
    buildCommand: cd "Learning System/frontend" && npm install && npm run build
    # Serve the built assets
    staticPublishPath: Learning System/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        # This automatically grabs the live URL of your Go backend once deployed
        fromService:
          name: krishnova-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
